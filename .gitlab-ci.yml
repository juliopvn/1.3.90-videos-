# Pipeline de calidad para VideoVault: install -> lint -> test (unit + e2e) -> build.
#
# El deploy NO se hace desde aquí. Este GitLab es self-hosted, así que
# Vercel no pudo conectarse a él de forma nativa: el repo se espeja a
# GitHub vía GitLab Push Mirroring (Settings -> Repository -> Mirroring
# repositories), y es ese espejo el que Vercel tiene conectado. Cada push a
# main en GitLab se refleja solo en GitHub y dispara un deploy en Vercel,
# independiente de este pipeline. Ver la sección "Despliegue" de README.md.
# Este pipeline solo garantiza calidad antes de que ese push llegue a main.
#
# Variables de entorno requeridas para el job test:e2e (Settings -> CI/CD ->
# Variables del proyecto en GitLab, NUNCA en texto plano en este archivo):
#   - CI_RUSTFS_ACCESS_KEY / CI_RUSTFS_SECRET_KEY: credenciales para el
#     RustFS efímero del pipeline (pueden ser cualquier valor no-default,
#     no hace falta que coincidan con las de desarrollo/producción).
#   - CI_JWT_SECRET: secreto de JWT para el entorno de test del pipeline
#     (distinto del de desarrollo y del de producción).
#
# Notas sobre el runner disponible en esta instancia
# (gitlab.codecrypto.academy), descubiertas con `glab api /runners` y
# `glab api /runners/<id>` (sin necesitar la UI de GitLab):
#
# 1. `tags: [cloudrun]` es obligatorio: el único runner compartido online
#    (cloudrun-ephemeral) tiene run_untagged=false, así que un job sin esta
#    tag se queda en "pending" para siempre (sin fallar ni avisar) porque
#    ningún runner lo recoge.
# 2. Ese runner usa el executor "shell", no Docker: el campo `image:` se
#    ignora en silencio (los jobs corren con lo que ya esté instalado en el
#    host) y el keyword `services:` de GitLab CI no funciona en absoluto
#    (services es una prestación del executor Docker). Por eso test:e2e
#    levanta MongoDB/RustFS con el mismo `docker compose up -d` que en
#    local, en vez de usar `services:`.
# 3. El límite de subida de artifacts de esta instancia es bajo: subir
#    node_modules/ completo como artifact falla con "413 Request Entity Too
#    Large". Por eso cada job instala sus propias dependencias con
#    `npm ci --prefer-offline` (rápido gracias al cache de npm_config_cache,
#    que sí se sube sin problema) en vez de heredar node_modules/ como
#    artifact del job install.

stages:
  - install
  - lint
  - test
  - build

default:
  tags:
    - cloudrun
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"

install:
  stage: install
  script:
    - npm ci --prefer-offline

lint:
  stage: lint
  needs: ["install"]
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npm run typecheck

test:unit:
  stage: test
  needs: ["install"]
  script:
    - npm ci --prefer-offline
    - npm run test:unit

test:e2e:
  stage: test
  needs: ["install"]
  variables:
    MONGODB_URI: "mongodb://localhost:27017"
    MONGODB_DB: "videovault_ci"
    RUSTFS_ENDPOINT: "http://localhost:9001"
    RUSTFS_ACCESS_KEY: "$CI_RUSTFS_ACCESS_KEY"
    RUSTFS_SECRET_KEY: "$CI_RUSTFS_SECRET_KEY"
    RUSTFS_BUCKET: "videos-ci"
    RUSTFS_REGION: "us-east-1"
    JWT_SECRET: "$CI_JWT_SECRET"
    JWT_EXPIRES_IN: "1h"
    NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    NODE_ENV: "production"
  script:
    - npm ci --prefer-offline
    - npx playwright install --with-deps chromium
    - docker compose up -d
    - npm run build
    - npm run test:e2e
  after_script:
    - docker compose down
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days

build:
  stage: build
  needs: ["install"]
  script:
    - npm ci --prefer-offline
    - npm run build
